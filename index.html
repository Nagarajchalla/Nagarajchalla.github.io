<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nagaraj Challa | DevOps & Security Engineer</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #020617);
      color: #e5e7eb;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 100px 30px;
    }

    /* HERO */
    header {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 100px;
      align-items: center;
    }

    .hello {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 60px;
      margin: 0 0 14px;
    }

    .passionate {
      font-size: 20px;
      color: #9ca3af;
    }

    .role {
      font-size: 28px;
      color: #f97316;
      font-weight: 600;
      margin: 8px 0 18px;
    }

    .tagline {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    /* PRIMARY BUTTONS */
    .main-buttons {
      display: flex;
      gap: 18px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 16px 34px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      border: 2px solid transparent;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: #f97316;
      color: #020617;
    }

    .btn-outline {
      background: rgba(255,255,255,0.03);
      color: #e5e7eb;
      border: 2px solid #1e293b;
    }

    /* THICK HOVER (LIKE LLOYD) */
    .btn:hover {
      background: #f97316;
      color: #020617;
      border-color: #f97316;
    }

    /* ICON BUTTONS */
    .icon-buttons {
      display: flex;
      gap: 14px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.03);
      border: 2px solid #1e293b;
      color: #e5e7eb;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .icon-btn:hover {
      background: #f97316;
      border-color: #f97316;
      color: #020617;
    }

    /* PROFILE IMAGE */
    .profile-wrapper {
      display: flex;
      justify-content: center;
    }

    .profile-ring {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #f97316, #fb923c);
      transition: box-shadow 0.3s ease;
    }

    .profile-ring:hover {
      box-shadow: 0 0 35px rgba(249,115,22,0.45);
    }

    .profile-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      background: #020617;
    }

    @media (max-width: 900px) {
      header {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .main-buttons,
      .icon-buttons {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <header>

    <!-- LEFT -->
    <div>
      <div class="hello">👋 Hello, I'm</div>

      <h1>Nagaraj Challa</h1>

      <div class="passionate">I'm a passionate</div>
      <div class="role">DevOps & Security Engineer ⚙️</div>

      <div class="tagline">
        AWS • Azure • Kubernetes • CI/CD • Cloud Security<br>
        Building scalable & secure cloud infrastructure 🚀
      </div>

      <!-- MAIN BUTTONS -->
      <div class="main-buttons">
        <a class="btn btn-primary" href="resume.pdf">Download Resume</a>
        <a class="btn btn-outline" href="projects.html">View Projects</a>
      </div>

      <!-- ICON BUTTONS (LIKE LLOYD) -->
      <div class="icon-buttons">
        <a class="icon-btn" href="https://linkedin.com/in/challa-nagaraju" target="_blank">🔗</a>
        <a class="icon-btn" href="mailto:nagarajreddy2219@gmail.com">✉️</a>
        <a class="icon-btn" href="tel:+918125377673">📞</a>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="profile-wrapper">
      <div class="profile-ring">
        <img src="profile.jpg" alt="Nagaraj Challa">
      </div>
    </div>

  </header>

</div>
</body>
</html>
