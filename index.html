<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nagaraj Challa | DevOps & Security Engineer</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: radial-gradient(circle at top left, #111827, #020617);
      color: #e5e7eb;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 90px 30px;
    }

    /* HERO */
    header {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 90px;
      align-items: center;
    }

    .hello {
      font-size: 18px;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 58px;
      margin: 0 0 14px;
    }

    .passionate {
      font-size: 20px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .role {
      font-size: 28px;
      color: #f97316;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .tagline {
      font-size: 18px;
      color: #9ca3af;
      margin-bottom: 42px;
      line-height: 1.6;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .buttons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      color: #e5e7eb;
      border: 1px solid #334155;
      background: rgba(255,255,255,0.02);
      transition: all 0.25s ease;
    }

    .buttons a.primary {
      background: #f97316;
      color: #020617;
      border-color: #f97316;
    }

    /* HOVER EFFECT LIKE LLOYD */
    .buttons a:hover {
      color: #f97316;
      border-color: #f97316;
      background: rgba(249,115,22,0.08);
    }

    .buttons a.primary:hover {
      background: #fb923c;
      color: #020617;
    }

    /* PROFILE IMAGE */
    .profile-wrapper {
      display: flex;
      justify-content: center;
    }

    .profile-ring {
      width: 330px;
      height: 330px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #f97316, #fb923c);
      transition: box-shadow 0.3s ease;
    }

    .profile-ring:hover {
      box-shadow: 0 0 32px rgba(249,115,22,0.4);
    }

    .profile-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      background: #020617;
    }

    @media (max-width: 900px) {
      header {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .buttons {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <!-- LEFT -->
    <div>
      <div class="hello">👋 Hello, I'm</div>

      <h1>Nagaraj Challa</h1>

      <div class="passionate">I'm a passionate</div>
      <div class="role">DevOps & Security Engineer ⚙️</div>

      <div class="tagline">
        AWS • Azure • Kubernetes • CI/CD • Cloud Security<br>
        Building scalable & secure cloud infrastructure 🚀
      </div>

      <div class="buttons">
        <a class="primary" href="resume.pdf">Download Resume</a>
        <a href="projects.html">View Projects</a>
        <a href="https://linkedin.com/in/challa-nagaraju" target="_blank">LinkedIn</a>
        <a href="mailto:nagarajreddy2219@gmail.com">Email</a>
        <a href="tel:+918125377673">Call</a>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="profile-wrapper">
      <div class="profile-ring">
        <img src="profile.jpg" alt="Nagaraj Challa">
      </div>
    </div>
  </header>

</div>
</body>
</html>
