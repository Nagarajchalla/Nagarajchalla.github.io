<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nagaraj Challa | DevOps & Security Engineer</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #020617);
      color: #e5e7eb;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 100px 30px;
    }

    header {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 100px;
      align-items: center;
    }

    .hello {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 60px;
      margin: 0 0 14px;
    }

    .passionate {
      font-size: 20px;
      color: #9ca3af;
    }

    .role {
      font-size: 28px;
      color: #f97316;
      font-weight: 600;
      margin: 8px 0 18px;
    }

    .tagline {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* ICON ROW (LIKE LLOYD) */
    .socials {
      display: flex;
      gap: 14px;
      margin-bottom: 30px;
    }

    .social {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 2px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .social svg {
      width: 20px;
      height: 20px;
      fill: #e5e7eb;
      transition: fill 0.25s ease;
    }

    .social:hover {
      background: #f97316;
      border-color: #f97316;
    }

    .social:hover svg {
      fill: #020617;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 16px 34px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      border: 2px solid transparent;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: #f97316;
      color: #020617;
      border-color: #f97316;
    }

    .btn-outline {
      background: rgba(255,255,255,0.04);
      color: #e5e7eb;
      border-color: #1e293b;
    }

    .btn:hover {
      background: #f97316;
      color: #020617;
      border-color: #f97316;
    }

    /* PROFILE IMAGE */
    .profile-wrapper {
      display: flex;
      justify-content: center;
    }

    .profile-ring {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #f97316, #fb923c);
    }

    .profile-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
    }

    @media (max-width: 900px) {
      header {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .socials,
      .buttons {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <header>

    <!-- LEFT -->
    <div>
      <div class="hello">👋 Hello, I'm</div>

      <h1>Nagaraj Challa</h1>

      <div class="passionate">I'm a passionate</div>
      <div class="role">DevOps & Security Engineer ⚙️</div>

      <div class="tagline">
        AWS • Azure • Kubernetes • CI/CD • Cloud Security<br>
        Building scalable & secure cloud infrastructure 🚀
      </div>

      <!-- SOCIAL ICONS (ABOVE BUTTONS LIKE LLOYD) -->
      <div class="socials">
        <!-- LinkedIn -->
        <a class="social" href="https://linkedin.com/in/challa-nagaraju" target="_blank">
          <svg viewBox="0 0 24 24">
            <path d="M4.98 3.5C4.98 4.88 3.88 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1 4.98 2.12 4.98 3.5zM0 8h5v16H0zM8 8h4.8v2.2h.1c.7-1.3 2.4-2.7 4.9-2.7 5.2 0 6.2 3.4 6.2 7.9V24h-5v-7.7c0-1.8 0-4.2-2.6-4.2-2.6 0-3 2-3 4v7.9H8z"/>
          </svg>
        </a>

        <!-- Email -->
        <a class="social" href="mailto:nagarajreddy2219@gmail.com">
          <svg viewBox="0 0 24 24">
            <path d="M2 4h20v16H2V4zm10 7L3.5 6h17L12 11z"/>
          </svg>
        </a>

        <!-- Phone -->
        <a class="social" href="tel:+918125377673">
          <svg viewBox="0 0 24 24">
            <path d="M6.6 10.8c1.5 3 3.6 5.1 6.6 6.6l2.2-2.2c.3-.3.8-.4 1.2-.2 1.3.5 2.7.8 4.1.8.7 0 1.3.6 1.3 1.3v3.5c0 .7-.6 1.3-1.3 1.3C9.6 22 2 14.4 2 4.3 2 3.6 2.6 3 3.3 3H6.8c.7 0 1.3.6 1.3 1.3 0 1.4.3 2.8.8 4.1.1.4 0 .9-.2 1.2l-2.1 2.2z"/>
          </svg>
        </a>
      </div>

      <!-- BUTTONS -->
      <div class="buttons">
        <a class="btn btn-primary" href="resume.pdf">Download Resume</a>
        <a class="btn btn-outline" href="projects.html">View Projects</a>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="profile-wrapper">
      <div class="profile-ring">
        <img src="profile.jpg" alt="Nagaraj Challa">
      </div>
    </div>

  </header>

</div>
</body>
</html>
