<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagaraj Challa | DevOps & Security Engineer</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #020617, #020617);
      color: #e5e7eb;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 80px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .content {
      max-width: 620px;
      position: relative;
      z-index: 10;
    }

    .hello {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 56px;
      margin: 0;
      font-weight: 700;
    }

    .passionate {
      color: #94a3b8;
      margin: 12px 0 6px;
      font-size: 18px;
    }

    .role {
      font-size: 28px;
      color: #f97316;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .gear {
      color: #f97316;
    }

    .stack {
      color: #cbd5f5;
      font-size: 16px;
      line-height: 1.6;
    }

    .social-icons {
      display: flex;
      gap: 14px;
      margin: 22px 0 26px;
      position: relative;
      z-index: 20;
    }

    .social-icons a {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 18px;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: #f97316;
      border-color: #f97316;
      background: rgba(249, 115, 22, 0.12);
      box-shadow: 0 0 18px rgba(249, 115, 22, 0.45);
    }

    .buttons {
      display: flex;
      gap: 16px;
      position: relative;
      z-index: 20;
    }

    .buttons a {
      padding: 14px 26px;
      border-radius: 12px;
      font-size: 16px;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .primary {
      background: #f97316;
      color: #020617;
      font-weight: 600;
    }

    .primary:hover {
      box-shadow: 0 0 22px rgba(249, 115, 22, 0.6);
    }

    .secondary {
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .secondary:hover {
      color: #f97316;
      border-color: #f97316;
      background: rgba(249, 115, 22, 0.08);
    }

    .profile-ring {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #f97316, #fb923c);
    }

    .profile-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
    }

    /* ===== HAMBURGER MENU ===== */
    .menu-btn {
      position: fixed;
      top: 22px;
      right: 28px;
      font-size: 26px;
      color: #f97316;
      cursor: pointer;
      z-index: 1000;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: -260px;
      width: 260px;
      height: 100%;
      background: #020617;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
      padding-top: 100px;
      transition: right 0.35s ease;
      z-index: 999;
    }

    .side-menu a {
      display: block;
      padding: 16px 32px;
      color: #e5e7eb;
      text-decoration: none;
      font-size: 18px;
      border-left: 4px solid transparent;
      transition: all 0.25s ease;
    }

    .side-menu a:hover {
      color: #f97316;
      border-left-color: #f97316;
      background: rgba(249, 115, 22, 0.08);
    }

    .side-menu.open {
      right: 0;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column-reverse;
        text-align: center;
      }

      .buttons,
      .social-icons {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<!-- Hamburger -->
<div class="menu-btn" onclick="toggleMenu()">☰</div>

<!-- Sidebar -->
<div id="side-menu" class="side-menu">
  <a href="#about" onclick="toggleMenu()">About</a>
  <a href="#skills" onclick="toggleMenu()">Skills</a>
  <a href="#contact" onclick="toggleMenu()">Contact</a>
</div>

<div class="container">
  <div class="content">
    <div class="hello">👋 Hello, I'm</div>
    <h1>Nagaraj Challa</h1>
    <div class="passionate">I'm a passionate</div>

    <div class="role">
      DevOps & Security Engineer <span class="gear">⚙️</span>
    </div>

    <div class="stack">
      AWS • Azure • Kubernetes • CI/CD • Cloud Security <br />
      Building scalable & secure cloud infrastructure 🚀
    </div>

    <div class="social-icons">
      <a href="https://www.linkedin.com/in/challa-nagaraju" target="_blank">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>
      <a href="mailto:nagarajreddy2219@gmail.com">
        <i class="fa-regular fa-envelope"></i>
      </a>
      <a href="tel:+918125377673">
        <i class="fa-solid fa-phone"></i>
      </a>
    </div>

    <div class="buttons">
      <a class="primary" href="resume.pdf" download>Download Resume</a>
      <a class="secondary" href="projects.html">View Projects</a>
    </div>
  </div>

  <div class="profile-ring">
    <img src="profile.jpg" alt="Nagaraj Challa" />
  </div>
</div>

<!-- Dummy anchors (no visual change) -->
<div id="about"></div>
<div id="skills"></div>
<div id="contact"></div>

<script>
  function toggleMenu() {
    document.getElementById("side-menu").classList.toggle("open");
  }
</script>

</body>
</html>
