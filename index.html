    .role {

      color: #f97316;

    .tagline {

    }

      color: #e5e7eb;
      background: rgba(255,255,255,0.02);

    .profile-wrapper {
      display: flex;

      width: 320px;
      height: 320px;

    .profile-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      background: #020617;
    }

    @media (max-width: 900px) {
      header {
        grid-template-columns: 1fr;
        text-align: center;
      }
